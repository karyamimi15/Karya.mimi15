<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:linear-gradient(
        -45deg,
        #4c1d95,
        #7c3aed,
        #d946ef,
        #ec4899
    );

    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
}

@keyframes gradientBG{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

/* Bubble Background */

.background{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.background span{
    position:absolute;
    display:block;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    bottom:-150px;
    animation:bubble 18s linear infinite;
}

@keyframes bubble{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-1200px) rotate(720deg);
        opacity:0;
    }
}

/* Card */

.container{
    width:100%;
    max-width:500px;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:35px;

    text-align:center;

    border:1px solid rgba(255,255,255,.4);

    box-shadow:0 20px 50px rgba(0,0,0,.2);

    animation:fadeUp .8s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Logo */

.logo{
    width:170px;
    height:170px;
    object-fit:cover;
    border-radius:50%;

    border:3px solid #f5c542;

    box-shadow:
    0 0 25px rgba(245,197,66,.5);

    animation:floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0);
    }
}

h1{
    margin-top:20px;

    font-size:34px;

    font-weight:800;

    background:linear-gradient(
        90deg,
        #6d28d9,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.bio{
    margin-top:15px;
    line-height:1.8;
    color:#666;
}

/* Social Icons */

.socials{
    margin-top:20px;

    display:flex;

    justify-content:center;

    gap:15px;
}

.socials a{
    width:48px;
    height:48px;

    border-radius:50%;

    background:white;

    color:#7c3aed;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-size:20px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    transition:.3s;
}

.socials a:hover{
    transform:translateY(-4px);

    background:#7c3aed;

    color:white;
}

/* Buttons */

.link{
    position:relative;

    overflow:hidden;

    display:block;

    margin-top:15px;

    padding:18px;

    border-radius:18px;

    color:white;

    text-decoration:none;

    font-weight:600;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
    );

    box-shadow:0 8px 20px rgba(124,58,237,.3);

    transition:.3s;
}

.link i{
    margin-right:10px;
}

.link::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    rgba(255,255,255,.25);

    transition:.5s;
}

.link:hover::before{
    left:100%;
}

.link:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 30px rgba(124,58,237,.4),
        0 0 20px rgba(168,85,247,.4);
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#888;
}

</style>
</head>
